<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="hud_cyan_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="hud_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="hud_grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Wave Clip Path inside defs to strictly prevent any overflow -->
    <clipPath id="hud_wave_clip">
      <rect x="0" y="42" width="480" height="120" rx="10" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.3; }
      100% { transform: translateY(260px); opacity: 0.1; }
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="260" rx="16" fill="url(#hud_bg)" stroke="url(#hud_border)" stroke-width="1.2" />
  <rect width="880" height="260" rx="16" fill="url(#hud_grid)" />

  <!-- Top Status Bar -->
  <g transform="translate(24, 22)">
    <!-- Radar Pulse Indicator -->
    <circle cx="6" cy="6" r="5" fill="#10b981" filter="url(#soft_glow)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="mono" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="1.5">TELEMETRY // LIVE CODE VELOCITY &amp; EVALUATION</text>
    
    <text x="832" y="10" class="mono" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" letter-spacing="1">STATUS: OPERATIONAL [CI GATE 100% PASS]</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="42" x2="856" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- ================= LEFT COLUMN: ACTIVITY WAVE & REPO VELOCITY ================= -->
  <g transform="translate(24, 56)">
    <!-- Subtitle -->
    <text x="0" y="14" class="sans" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.3">Empirical Commit &amp; Evaluation Waveform</text>
    <text x="0" y="30" class="sans" font-size="11" fill="#64748b">Multi-repository continuous integration across Vision, Retrieval &amp; Agent suites</text>

    <!-- Synthetic Area Wave Graph Box -->
    <rect x="0" y="42" width="480" height="120" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />

    <!-- Wave Grid Lines -->
    <line x1="0" y1="72" x2="480" y2="72" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="4,4" />
    <line x1="0" y1="102" x2="480" y2="102" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="4,4" />
    <line x1="0" y1="132" x2="480" y2="132" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="4,4" />

    <line x1="120" y1="42" x2="120" y2="162" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="4,4" />
    <line x1="240" y1="42" x2="240" y2="162" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="4,4" />
    <line x1="360" y1="42" x2="360" y2="162" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="4,4" />

    <!-- Bounded Wave Content inside ClipPath -->
    <g clip-path="url(#hud_wave_clip)">
      <!-- Area Fill Under Wave -->
      <path d="M 0 162 L 0 135 C 30 135, 45 110, 75 110 C 105 110, 115 130, 145 130 C 175 130, 185 85, 220 85 C 255 85, 270 122, 305 122 C 340 122, 360 72, 400 72 C 430 72, 445 62, 475 62 L 480 62 L 480 162 Z" 
            fill="url(#hud_cyan_purple)" fill-opacity="0.15" />

      <!-- Main Wave Line with Glowing Animation -->
      <path d="M 0 135 C 30 135, 45 110, 75 110 C 105 110, 115 130, 145 130 C 175 130, 185 85, 220 85 C 255 85, 270 122, 305 122 C 340 122, 360 72, 400 72 C 430 72, 445 62, 475 62" 
            fill="none" stroke="url(#hud_cyan_purple)" stroke-width="2.6" filter="url(#glow)" />

      <!-- Milestone Activity Points on Wave -->
      <circle cx="75" cy="110" r="3" fill="#22d3ee" />
      <circle cx="220" cy="85" r="3.5" fill="#818cf8" />
      <circle cx="400" cy="72" r="3.5" fill="#a78bfa" />

      <!-- Active Pulsing Target Point at End -->
      <circle cx="475" cy="62" r="4.5" fill="#f472b6" filter="url(#glow)">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="475" cy="62" r="9" fill="none" stroke="#f472b6" stroke-width="1.2" opacity="0.6">
        <animate attributeName="r" values="4;12;4" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Wave Graph Time Labels -->
    <text x="14" y="154" class="mono" font-size="9" fill="#64748b">Q2 '24</text>
    <text x="125" y="154" class="mono" font-size="9" fill="#64748b">Q3 '24</text>
    <text x="245" y="154" class="mono" font-size="9" fill="#64748b">Q4 '24</text>
    <text x="365" y="154" class="mono" font-size="9" fill="#64748b">Q1 '25</text>
    <text x="445" y="154" class="mono" font-size="9" fill="#22d3ee" font-weight="700">ACTIVE</text>

    <!-- Metric Badges Row Below Wave -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="112" height="24" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <text x="56" y="16" class="mono" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">10 REPOSITORIES</text>

      <rect x="122" y="0" width="112" height="24" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <text x="178" y="16" class="mono" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle">0.927 TEST AUC</text>

      <rect x="244" y="0" width="116" height="24" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <text x="302" y="16" class="mono" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">2,667 NIR SAMPLES</text>

      <rect x="368" y="0" width="112" height="24" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <text x="424" y="16" class="mono" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">KAPPA = 0.82</text>
    </g>
  </g>

  <!-- Center Vertical Divider -->
  <line x1="532" y1="56" x2="532" y2="242" stroke="#1e293b" stroke-width="1" />

  <!-- ================= RIGHT COLUMN: LANGUAGE & RESEARCH STACK ================= -->
  <g transform="translate(556, 56)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.3">Ecosystem &amp; Core Workload Distribution</text>
    <text x="0" y="30" class="sans" font-size="11" fill="#64748b">Production repos &amp; research benchmark environments</text>

    <!-- Stack Bars -->
    <!-- Bar 1: Python & PyTorch / ML Core -->
    <g transform="translate(0, 48)">
      <text x="0" y="10" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">Python (PyTorch, timm, BEIR)</text>
      <text x="300" y="10" class="mono" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="end">72.4%</text>
      <rect x="0" y="16" width="300" height="7" rx="3.5" fill="#161b2e"/>
      <rect x="0" y="16" width="217" height="7" rx="3.5" fill="#22d3ee" filter="url(#soft_glow)">
        <animate attributeName="width" values="0;217" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>

    <!-- Bar 2: TypeScript & Next.js / React -->
    <g transform="translate(0, 80)">
      <text x="0" y="10" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">TypeScript / React 19 / Next.js</text>
      <text x="300" y="10" class="mono" font-size="11" font-weight="700" fill="#818cf8" text-anchor="end">14.8%</text>
      <rect x="0" y="16" width="300" height="7" rx="3.5" fill="#161b2e"/>
      <rect x="0" y="16" width="44" height="7" rx="3.5" fill="#818cf8">
        <animate attributeName="width" values="0;44" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>

    <!-- Bar 3: Vue 3 & Laravel / Systems -->
    <g transform="translate(0, 112)">
      <text x="0" y="10" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">Vue 3 / Laravel 11 / Microservices</text>
      <text x="300" y="10" class="mono" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="end">8.2%</text>
      <rect x="0" y="16" width="300" height="7" rx="3.5" fill="#161b2e"/>
      <rect x="0" y="16" width="25" height="7" rx="3.5" fill="#a78bfa">
        <animate attributeName="width" values="0;25" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>

    <!-- Bar 4: Docker & CI / Telemetry -->
    <g transform="translate(0, 144)">
      <text x="0" y="10" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">Docker / GitHub Actions / SQL</text>
      <text x="300" y="10" class="mono" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">4.6%</text>
      <rect x="0" y="16" width="300" height="7" rx="3.5" fill="#161b2e"/>
      <rect x="0" y="16" width="14" height="7" rx="3.5" fill="#10b981">
        <animate attributeName="width" values="0;14" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
  </g>
</svg>
