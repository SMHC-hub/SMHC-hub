<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="city_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="city_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="tower_cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="tower_violet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="tower_pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="tower_emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid_dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="880" height="340" rx="18" fill="url(#city_bg)" stroke="url(#city_border)" stroke-width="1.2"/>
  <rect width="880" height="340" rx="18" fill="url(#grid_dots)"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="14" class="sans" font-size="15" font-weight="700" fill="#f1f5f9">3D Contribution Skyline</text>
    <text x="0" y="28" class="mono" font-size="10.5" fill="#64748b">ISOMETRIC COMMIT METROPOLIS // REFRESHED DAILY VIA GITHUB ACTIONS</text>
    <g transform="translate(680, 0)">
      <rect width="140" height="24" rx="6" fill="#141828" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16" class="mono" font-size="9.5" fill="#22d3ee">NIGHT RAINBOW</text>
    </g>
  </g>

  <!-- Isometric Grid & Towers -->
  <g transform="translate(440, 205) scale(1, 0.58) rotate(45)">
    <!-- Base Floor Grid -->
    <rect x="-180" y="-180" width="360" height="360" rx="12" fill="#0d111e" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Isometric Tower Clusters (Commit Heights) -->
    <g transform="translate(0, 0)">
      <rect x="-12" y="-12" width="24" height="24" fill="url(#tower_cyan)"/>
      <rect x="-10" y="-10" width="20" height="20" fill="#22d3ee"/>
    </g>
    <rect x="-40" y="-20" width="18" height="18" fill="url(#tower_violet)"/>
    <rect x="-20" y="-45" width="16" height="16" fill="url(#tower_pink)"/>
    <rect x="25" y="-15" width="20" height="20" fill="url(#tower_emerald)"/>
    <rect x="-60" y="-50" width="14" height="14" fill="url(#tower_cyan)"/>
    <rect x="-80" y="-25" width="15" height="15" fill="url(#tower_violet)"/>
    <rect x="50" y="-40" width="16" height="16" fill="url(#tower_pink)"/>
    <rect x="15" y="-65" width="18" height="18" fill="url(#tower_cyan)"/>
    
    <rect x="-35" y="25" width="18" height="18" fill="url(#tower_emerald)"/>
    <rect x="10" y="30" width="22" height="22" fill="url(#tower_cyan)"/>
    <rect x="-15" y="55" width="16" height="16" fill="url(#tower_violet)"/>
    <rect x="40" y="20" width="15" height="15" fill="url(#tower_pink)"/>
    <rect x="-70" y="15" width="14" height="14" fill="url(#tower_cyan)"/>
    <rect x="65" y="45" width="16" height="16" fill="url(#tower_emerald)"/>
    <rect x="30" y="65" width="18" height="18" fill="url(#tower_violet)"/>
    <rect x="-55" y="50" width="15" height="15" fill="url(#tower_pink)"/>

    <rect x="-120" y="-80" width="12" height="12" fill="#1e293b"/>
    <rect x="-100" y="-120" width="12" height="12" fill="#22d3ee" opacity="0.6"/>
    <rect x="80" y="-100" width="12" height="12" fill="#a78bfa" opacity="0.7"/>
    <rect x="110" y="-70" width="12" height="12" fill="#f472b6" opacity="0.6"/>
    <rect x="-110" y="80" width="12" height="12" fill="#34d399" opacity="0.6"/>
    <rect x="90" y="90" width="12" height="12" fill="#22d3ee" opacity="0.7"/>
  </g>

  <!-- Ambient Glow Reflections -->
  <circle cx="440" cy="205" r="140" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="440" cy="205" r="220" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8 8" opacity="0.2"/>

  <!-- Footer Legend -->
  <g transform="translate(30, 305)" class="mono" font-size="10" fill="#64748b">
    <text x="0" y="0">Skyline Density reflects commit frequency and active code changes across repositories.</text>
  </g>
</svg>
