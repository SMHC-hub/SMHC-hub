<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%">
  <defs>
    
    <linearGradient id="stack_aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="stack_border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="stack_dot_grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.2" />
    </pattern>
    <radialGradient id="core_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0"/>
    </radialGradient>

    <filter id="stack_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Motion Paths for Orbits -->
    <!-- Orbit 1 (tilted -20deg) -->
    <path id="orbit1_path" d="M 210,140 A 135,55 -20 1 0 210,250 A 135,55 -20 1 0 210,140" fill="none"/>
    <!-- Orbit 2 (tilted +25deg) -->
    <path id="orbit2_path" d="M 210,130 A 155,68 25 1 0 210,260 A 155,68 25 1 0 210,130" fill="none"/>
    <!-- Orbit 3 (tilted -60deg) -->
    <path id="orbit3_path" d="M 210,120 A 175,80 -60 1 0 210,270 A 175,80 -60 1 0 210,120" fill="none"/>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
  </style>

  <!-- Canvas Outer Background -->
  <rect width="880" height="390" rx="18" fill="#0d0e16" stroke="url(#stack_border_grad)" stroke-width="1.2"/>
  <rect width="880" height="390" rx="18" fill="url(#stack_dot_grid)"/>

  <!-- ============================================== -->
  <!-- LEFT: TILTED ORBITS AROUND GLOWING ATOM CORE   -->
  <!-- ============================================== -->
  <g transform="translate(10, 0)">
    <!-- Core Ambient Glow -->
    <circle cx="210" cy="195" r="95" fill="url(#core_glow)"/>
    <circle cx="210" cy="195" r="26" fill="#131728" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="stroke" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Core Center Symbol -->
    <text x="210" y="202" class="font-sans" font-size="20" text-anchor="middle" fill="#fff">⚡</text>

    <!-- Orbit 1 Ellipse Path Line -->
    <ellipse cx="210" cy="195" rx="135" ry="55" transform="rotate(-20 210 195)" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" opacity="0.6"/>
    <!-- Orbit 2 Ellipse Path Line -->
    <ellipse cx="210" cy="195" rx="155" ry="68" transform="rotate(25 210 195)" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.2" opacity="0.6"/>
    <!-- Orbit 3 Ellipse Path Line -->
    <ellipse cx="210" cy="195" rx="175" ry="80" transform="rotate(-60 210 195)" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" opacity="0.5"/>

    <!-- TRAVELING ICONS -->
    <!-- Icon 1: Python on Orbit 1 -->
    <g>
      <animateMotion dur="14s" repeatCount="indefinite">
        <mpath href="#orbit1_path"/>
      </animateMotion>
      <circle cx="0" cy="0" r="15" fill="#151b2e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="5" class="font-sans" font-size="12" text-anchor="middle" font-weight="800" fill="#38bdf8">Py</text>
    </g>

    <!-- Icon 2: PyTorch on Orbit 2 -->
    <g>
      <animateMotion dur="18s" repeatCount="indefinite">
        <mpath href="#orbit2_path"/>
      </animateMotion>
      <circle cx="0" cy="0" r="16" fill="#151b2e" stroke="#f97316" stroke-width="1.5"/>
      <text x="0" y="5" class="font-sans" font-size="11" text-anchor="middle" font-weight="800" fill="#f97316">🔥</text>
    </g>

    <!-- Icon 3: Docker on Orbit 3 -->
    <g>
      <animateMotion dur="22s" repeatCount="indefinite">
        <mpath href="#orbit3_path"/>
      </animateMotion>
      <circle cx="0" cy="0" r="15" fill="#151b2e" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="0" y="5" class="font-sans" font-size="12" text-anchor="middle" font-weight="800" fill="#0ea5e9">🐳</text>
    </g>

    <!-- Icon 4: FastAPI on Orbit 2 (offset) -->
    <g>
      <animateMotion dur="18s" begin="-9s" repeatCount="indefinite">
        <mpath href="#orbit2_path"/>
      </animateMotion>
      <circle cx="0" cy="0" r="15" fill="#151b2e" stroke="#10b981" stroke-width="1.5"/>
      <text x="0" y="5" class="font-sans" font-size="11" text-anchor="middle" font-weight="800" fill="#10b981">⚡</text>
    </g>

    <!-- Icon 5: REACT with TWO ORBITING MOONS on Orbit 1 -->
    <g>
      <animateMotion dur="14s" begin="-7s" repeatCount="indefinite">
        <mpath href="#orbit1_path"/>
      </animateMotion>
      <!-- React Icon Base -->
      <circle cx="0" cy="0" r="17" fill="#151b2e" stroke="#22d3ee" stroke-width="1.8"/>
      <text x="0" y="5" class="font-sans" font-size="13" text-anchor="middle" font-weight="800" fill="#22d3ee">⚛</text>

      <!-- Moon 1: TypeScript orbiting React -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite"/>
        <circle cx="28" cy="0" r="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="28" y="3" class="font-mono" font-size="6.5" text-anchor="middle" font-weight="700" fill="#93c5fd">TS</text>
      </g>

      <!-- Moon 2: Next.js orbiting React (opposite angle) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="3.5s" repeatCount="indefinite"/>
        <circle cx="28" cy="0" r="7" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
        <text x="28" y="3" class="font-mono" font-size="6.5" text-anchor="middle" font-weight="700" fill="#f472b6">N</text>
      </g>
    </g>

    <!-- Label Under Orbit Area -->
    <text x="210" y="348" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="1">ORBITING TECH ATOM // ZERO COLLISION</text>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: GROUPED CHIP GRID WITH SEQUENTIAL GLOWS -->
  <!-- ============================================== -->
  <g transform="translate(425, 25)">
    <!-- Header -->
    <text x="0" y="16" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Technical Ecosystem &amp; Stack</text>
    <text x="0" y="32" class="font-mono" font-size="11" fill="#64748b">CHIP MATRIX WITH ACTIVE SEQUENTIAL PHOSPHOR</text>

    <!-- Group 1: AI & Deep Learning -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" class="font-mono" font-size="10.5" font-weight="700" fill="#22d3ee" letter-spacing="1">01 / AI &amp; COMPUTER VISION</text>
      <g transform="translate(0, 10)">
        <!-- Chip 1: PyTorch -->
        <g transform="translate(0, 0)">
          <rect width="84" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#22d3ee;#334155" dur="4s" begin="0s" repeatCount="indefinite"/>
          </rect>
          <text x="42" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">PyTorch</text>
        </g>
        <!-- Chip 2: TensorFlow -->
        <g transform="translate(90, 0)">
          <rect width="102" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#22d3ee;#334155" dur="4s" begin="0.4s" repeatCount="indefinite"/>
          </rect>
          <text x="51" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">TensorFlow</text>
        </g>
        <!-- Chip 3: OpenCV -->
        <g transform="translate(198, 0)">
          <rect width="80" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#22d3ee;#334155" dur="4s" begin="0.8s" repeatCount="indefinite"/>
          </rect>
          <text x="40" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">OpenCV</text>
        </g>
        <!-- Chip 4: MediaPipe -->
        <g transform="translate(284, 0)">
          <rect width="90" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#22d3ee;#334155" dur="4s" begin="1.2s" repeatCount="indefinite"/>
          </rect>
          <text x="45" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">MediaPipe</text>
        </g>
        <!-- Chip 5: HuggingFace -->
        <g transform="translate(380, 0)">
          <rect width="45" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#22d3ee;#334155" dur="4s" begin="1.6s" repeatCount="indefinite"/>
          </rect>
          <text x="22" y="17" class="font-sans" font-size="12" text-anchor="middle">🤗</text>
        </g>
      </g>
    </g>

    <!-- Group 2: Full-Stack & Systems -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-mono" font-size="10.5" font-weight="700" fill="#a78bfa" letter-spacing="1">02 / SYSTEMS &amp; BACKEND</text>
      <g transform="translate(0, 10)">
        <!-- FastAPI -->
        <g transform="translate(0, 0)">
          <rect width="80" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#a78bfa;#334155" dur="4s" begin="0.2s" repeatCount="indefinite"/>
          </rect>
          <text x="40" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">FastAPI</text>
        </g>
        <!-- Python -->
        <g transform="translate(86, 0)">
          <rect width="78" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#a78bfa;#334155" dur="4s" begin="0.6s" repeatCount="indefinite"/>
          </rect>
          <text x="39" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Python</text>
        </g>
        <!-- React 19 -->
        <g transform="translate(170, 0)">
          <rect width="80" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#a78bfa;#334155" dur="4s" begin="1.0s" repeatCount="indefinite"/>
          </rect>
          <text x="40" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">React 19</text>
        </g>
        <!-- TypeScript -->
        <g transform="translate(256, 0)">
          <rect width="95" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#a78bfa;#334155" dur="4s" begin="1.4s" repeatCount="indefinite"/>
          </rect>
          <text x="47" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
        </g>
        <!-- PostgreSQL -->
        <g transform="translate(357, 0)">
          <rect width="68" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#a78bfa;#334155" dur="4s" begin="1.8s" repeatCount="indefinite"/>
          </rect>
          <text x="34" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text>
        </g>
      </g>
    </g>

    <!-- Group 3: Infra, Cloud & MLOps -->
    <g transform="translate(0, 200)">
      <text x="0" y="0" class="font-mono" font-size="10.5" font-weight="700" fill="#f472b6" letter-spacing="1">03 / CLOUD, MLOPS &amp; DEPLOY</text>
      <g transform="translate(0, 10)">
        <!-- Docker -->
        <g transform="translate(0, 0)">
          <rect width="78" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#f472b6;#334155" dur="4s" begin="0.3s" repeatCount="indefinite"/>
          </rect>
          <text x="39" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Docker</text>
        </g>
        <!-- Linux -->
        <g transform="translate(84, 0)">
          <rect width="68" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#f472b6;#334155" dur="4s" begin="0.7s" repeatCount="indefinite"/>
          </rect>
          <text x="34" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Linux</text>
        </g>
        <!-- GitHub CI -->
        <g transform="translate(158, 0)">
          <rect width="100" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#f472b6;#334155" dur="4s" begin="1.1s" repeatCount="indefinite"/>
          </rect>
          <text x="50" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">GitHub Actions</text>
        </g>
        <!-- Railway / Cloud -->
        <g transform="translate(264, 0)">
          <rect width="80" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#f472b6;#334155" dur="4s" begin="1.5s" repeatCount="indefinite"/>
          </rect>
          <text x="40" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Railway</text>
        </g>
        <!-- Render -->
        <g transform="translate(350, 0)">
          <rect width="75" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#f472b6;#334155" dur="4s" begin="1.9s" repeatCount="indefinite"/>
          </rect>
          <text x="37" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Render</text>
        </g>
      </g>
    </g>

    <!-- Group 4: Observability & Benchmarks -->
    <g transform="translate(0, 274)">
      <text x="0" y="0" class="font-mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">04 / OBSERVABILITY &amp; EVALUATION</text>
      <g transform="translate(0, 10)">
        <!-- AgentPulse -->
        <g transform="translate(0, 0)">
          <rect width="98" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#34d399;#334155" dur="4s" begin="0.1s" repeatCount="indefinite"/>
          </rect>
          <text x="49" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">AgentPulse</text>
        </g>
        <!-- Groq LLM -->
        <g transform="translate(104, 0)">
          <rect width="85" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#34d399;#334155" dur="4s" begin="0.5s" repeatCount="indefinite"/>
          </rect>
          <text x="42" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Groq LLM</text>
        </g>
        <!-- Scikit-Learn -->
        <g transform="translate(195, 0)">
          <rect width="98" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#34d399;#334155" dur="4s" begin="0.9s" repeatCount="indefinite"/>
          </rect>
          <text x="49" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Scikit-Learn</text>
        </g>
        <!-- NumPy & Pandas -->
        <g transform="translate(299, 0)">
          <rect width="126" height="26" rx="6" fill="#121626" stroke="#334155" stroke-width="1">
            <animate attributeName="stroke" values="#334155;#34d399;#334155" dur="4s" begin="1.3s" repeatCount="indefinite"/>
          </rect>
          <text x="63" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">NumPy / Pandas</text>
        </g>
      </g>
    </g>
  </g>
</svg>
